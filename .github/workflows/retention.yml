name: Shop retention — daily purge & reminders

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: shop-retention
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast if retention secrets are missing
        run: |
          for v in CRON_SECRET EXPORT_ENCRYPTION_KEY STORAGE_BUCKET VERCEL_PROJECT_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret $v"
              exit 1
            fi
          done
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPORT_ENCRYPTION_KEY: ${{ secrets.EXPORT_ENCRYPTION_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          VERCEL_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL }}

      - name: Send retention reminders (44/40/30-day and final notice)
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_PROJECT_URL }}/api/shop-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Purge retention-due shops (encrypted export + anonymize)
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_PROJECT_URL }}/api/shop-purge" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"